<!DOCTYPE html>
<html>

<head>
  <title>Wunschliste bearbeiten</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>

<body>
  <video autoplay muted loop id="background-video">
    <source src="/assets/christmas.mp4" type="video/mp4">
  </video>
  <audio id="background-music" loop>
    <source src="/assets/christmas.mp3" type="audio/mpeg">
  </audio>

  <div class="content">
    <h1 id="person-name">Wunschliste bearbeiten</h1>
    <a href="/" class="nav-link">← Zurück zur Übersicht</a>
    <a href="#" id="view-link" class="nav-link">Wunschliste anzeigen</a>

    <section>
      <h2>Geschenk hinzufügen</h2>
      <input type="text" id="item-name" placeholder="Geschenk">
      <button onclick="addItem()">Geschenk hinzufügen</button>
    </section>

    <section>
      <div id="wishlist"></div>
    </section>
  </div>

  <script src="/js/script-edit.js"></script>
</body>

</html>
