<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Wunschliste bearbeiten</title>
  <link rel="stylesheet" href="/styles/style.css">
  <link rel="icon" href="/assets/favicon.ico" />
</head>

<body>
  <video autoplay muted loop id="background-video">
    <source src="/assets/christmas.mp4" type="video/mp4">
  </video>
  <audio id="background-music" loop>
    <source src="/assets/christmas.mp3" type="audio/mpeg">
  </audio>

  <div class="content">
    <h1 id="person-name">Wunschliste bearbeiten</h1>
    <a href="/" class="nav-link">← Zurück zur Übersicht</a>
    <a href="#" id="view-link" class="nav-link" target="_blank">Wunschliste anzeigen</a>

    <section>
      <h2>Wunsch hinzufügen</h2>
      <div class="add-item">
        <input type="text" id="item-name" placeholder="Wunsch">
        <button onclick="addItem()">Hinzufügen</button>
      </div>
    </section>

    <section>
      <div id="wishlist" class="edit-list"></div>
    </section>
  </div>

  <script src="/js/script-edit.js"></script>
</body>

</html>
