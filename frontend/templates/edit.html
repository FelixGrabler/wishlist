<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wunschliste bearbeiten</title>
  <link rel="stylesheet" href="/styles/style.css">
  <link rel="icon" href="/assets/favicon.ico" />
  <script src="/js/background-video.js" defer></script>
</head>

<body>
  <video muted playsinline preload="auto" aria-hidden="true" poster="/assets/frame.jpg" id="background-video">
    <source src="/assets/christmas.mp4" type="video/mp4">
  </video>
  <audio id="background-music" loop preload="auto">
    <source src="/assets/christmas.mp3" type="audio/mpeg">
  </audio>

  <div class="media-controls">
    <button id="music-toggle" class="icon-button" aria-label="Musik ausschalten" title="Musik ausschalten" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H3v6h3l5 4Z" />
        <path class="sound-on" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
        <path class="sound-off" d="m16 9 6 6m0-6-6 6" hidden />
      </svg>
    </button>
  </div>
  <main id="page" data-page="edit">
    <button id="person-settings" class="icon-button person-settings" aria-label="Person verwalten" title="Person verwalten">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M9 6V3m0 3v3M3 12h18m-6 0V9m0 3v3M3 18h18m-12 0v-3m0 3v3" />
      </svg>
    </button>
    <dialog id="delete-person-dialog" class="settings-dialog" aria-labelledby="delete-person-title">
      <h2 id="delete-person-title">Person löschen?</h2>
      <p id="delete-person-message" role="status"></p>
      <div class="dialog-actions">
        <button id="cancel-delete-person" type="button" autofocus>Abbrechen</button>
        <button id="confirm-delete-person" class="danger-button" type="button" disabled>Person löschen</button>
      </div>
    </dialog>
    <div class="content">
      <p id="status" role="alert"></p>
      <h1 id="person-name">Wunschliste bearbeiten</h1>
      <a href="/" class="nav-link">← Zurück zur Übersicht</a>
      <a href="#" id="view-link" class="nav-link" rel="noopener noreferrer">Wunschliste anzeigen</a>

      <section>
        <h2 id="form-heading">Wunsch hinzufügen</h2>
        <form class="add-item" id="item-form">
          <input type="text" id="item-name" placeholder="Wunsch" aria-label="Wunsch" required maxlength="200">
          <input type="url" id="item-link" placeholder="Link (optional)" aria-label="Link (optional)" maxlength="2048">
          <label for="item-image" class="file-input-label">Bild (optional)</label>
          <input type="file" id="item-image" accept="image/png,image/jpeg,image/gif,image/webp">
          <p>PNG, JPEG, GIF oder WebP, maximal 5 MB.</p>
          <label id="remove-image-label" hidden><input type="checkbox" id="remove-image">Vorhandenes Bild entfernen</label>
          <button type="submit" id="save-item">Hinzufügen</button>
          <button type="button" id="cancel-edit" hidden>Abbrechen</button>
        </form>
      </section>

      <section>
        <div id="wishlist" class="edit-list"></div>
      </section>
    </div>

    <dialog id="image-lightbox" class="image-lightbox" aria-label="Bildvorschau">
      <button id="image-lightbox-close" class="image-lightbox__close" aria-label="Bild schließen">&times;</button>
      <img id="image-lightbox-img" class="image-lightbox__image" alt="Bildvorschau">
    </dialog>

  </main>
  <script src="/js/common.js"></script>
  <script src="/js/move-random.js"></script>
  <script src="/js/script-index.js"></script>
  <script src="/js/script-edit.js"></script>
  <script src="/js/script-wishlist.js"></script>
  <script src="/js/navigation.js"></script>
</body>

</html>
