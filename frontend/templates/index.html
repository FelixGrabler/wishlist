<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Wunschzettel</title>
  <link rel="stylesheet" href="/styles/style.css">
  <link rel="icon" href="/assets/favicon.ico" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>

<body>
  <video autoplay muted loop id="background-video">
    <source src="/assets/christmas.mp4" type="video/mp4">
  </video>

  <div class="version-badge">Version 1.4</div>

  <audio id="background-music" loop>
    <source src="/assets/christmas.mp3" type="audio/mpeg">
  </audio>

  <div class="content">
    <h1>🎁 Fliegende Wunschliste</h1>

    <section>
      <h2>Person hinzufügen</h2>
      <div class="add-person">
        <input id="person-name" placeholder="Name der Person">
        <input type="color" id="person-color" value="#1e792c">
        <button onclick="addPerson()">Hinzufügen</button>
      </div>
    </section>

    <section>
      <h2>Personen</h2>
      <div id="people-grid" class="people-grid"></div>
    </section>
  </div>

  <a class="impressum-link" href="https://grabler.me" target="_blank" rel="noopener">Impressum</a>

  <script src="/js/script-index.js"></script>
</body>

</html>
