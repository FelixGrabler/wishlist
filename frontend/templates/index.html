<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Wunschzettel</title>
  <link rel="stylesheet" href="/styles/style.css">
  <link rel="icon" href="/assets/favicon.ico" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="/js/background-video.js" defer></script>
</head>

<body>
  <video muted playsinline preload="auto" aria-hidden="true" poster="/assets/frame.jpg" id="background-video">
    <source src="/assets/christmas.mp4" type="video/mp4">
  </video>



  <audio id="background-music" loop preload="none">
    <source src="/assets/christmas.mp3" type="audio/mpeg">
  </audio>

  <div class="media-controls">
    <button id="music-toggle" aria-pressed="false">Musik einschalten</button>
    <button id="motion-toggle" aria-pressed="false">Bewegung pausieren</button>
  </div>
  <div class="content">
    <p id="status" role="alert"></p>
    <h1>🎁 Fliegende Wunschliste</h1>

    <section>
      <h2>Person hinzufügen</h2>
      <form class="add-person" id="person-form">
        <input id="person-name" placeholder="Name der Person" aria-label="Name der Person" required maxlength="200">
        <input type="color" aria-label="Farbe" id="person-color" value="#1e792c">
        <button type="submit">Hinzufügen</button>
      </form>
    </section>

    <section>
      <h2>Personen</h2>
      <div id="people-grid" class="people-grid"></div>
    </section>
  </div>

  <a class="impressum-link" href="https://grabler.me" target="_blank" rel="noopener">Impressum</a>

  <script src="/js/common.js"></script>
  <script src="/js/script-index.js"></script>
</body>

</html>
