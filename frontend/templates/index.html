<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Fliegende Wunschliste</title>
  <link rel="stylesheet" href="styles/style.css">
</head>

<body>
  <video autoplay muted loop id="background-video">
    <source src="assets/christmas.mp4" type="video/mp4">
  </video>

  <audio autoplay loop id="background-music">
    <source src="assets/christmas.mp3" type="audio/mpeg">
  </audio>

  <div class="content">
    <h1>🎁 Fliegende Wunschliste</h1>

    <section>
      <h2>Person hinzufügen</h2>
      <input id="person-name" placeholder="Name der Person">
      <input type="color" id="person-color" value="#ffb347">
      <button onclick="addPerson()">Hinzufügen</button>
    </section>

    <section>
      <h2>Geschenk hinzufügen</h2>
      <select id="person-select"></select>
      <input id="item-name" placeholder="Name des Geschenks">
      <button onclick="addItem()">Geschenk hinzufügen</button>
    </section>

    <div id="wishlist"></div>
  </div>

  <script src="js/script.js"></script>
</body>

</html>
