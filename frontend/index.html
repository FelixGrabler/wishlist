<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Flying Wishlist</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>🎁 Flying Wishlist</h1>

  <section>
    <h2>Add Person</h2>
    <input id="person-name" placeholder="Person name">
    <button onclick="addPerson()">Add</button>
  </section>

  <section>
    <h2>Add Item</h2>
    <select id="person-select"></select>
    <input id="item-name" placeholder="Item name">
    <button onclick="addItem()">Add Item</button>
  </section>

  <div id="wishlist"></div>

  <script src="script.js"></script>
</body>

</html>
