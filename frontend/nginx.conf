server {
    listen 80;
    server_name localhost;
    client_max_body_size 15m;
    root /usr/share/nginx/html;

    # Serve static files
    location /styles/ {
        add_header Cache-Control "public, max-age=14400" always;
        try_files $uri $uri/ =404;
    }

    # Serve assets
    location /assets/ {
        add_header Cache-Control "public, max-age=14400" always;
        try_files $uri $uri/ =404;
    }

    # Serve JavaScript files
    location /js/ {
        add_header Cache-Control "public, max-age=14400" always;
        try_files $uri $uri/ =404;
    }

    # API proxy
    # API proxy
    resolver 127.0.0.11 valid=30s; # Docker's internal DNS
    location /api/ {
        proxy_pass http://wishlist-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Edit page - support both /Name/edit and /edit/Name
    location ~ ^/(?:[^/]+/edit|edit/[^/]+)$ {
        try_files /templates/edit.html =404;
    }

    # Person page
    location ~ ^/[^/]+$ {
        try_files /templates/wishlist.html =404;
    }

    # Index page
    location / {
        add_header Cache-Control "public, max-age=600" always;
        try_files $uri /templates/index.html;
    }
}
