services:
  postgres:
    image: postgres:16-alpine
    container_name: wishlist-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=wishlist
      - POSTGRES_USER=wishlist
      - POSTGRES_PASSWORD=wishlist
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - grabler-network

  backend:
    build: ./backend
    container_name: wishlist-backend
    ports:
      - "8020:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://wishlist:wishlist@postgres:5432/wishlist
    depends_on:
      - postgres
    networks:
      - grabler-network

  frontend:
    build: ./frontend
    container_name: wishlist-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - grabler-network

networks:
  grabler-network:
    external: true

volumes:
  postgres_data:
