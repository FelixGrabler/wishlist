version: '3.9'

services:
  backend:
    build: ./backend
    container_name: wishlist-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./wishlist.db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: wishlist-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
